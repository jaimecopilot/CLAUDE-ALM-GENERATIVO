name: Validar L02 en Windows, PowerShell 5.1 y Bash
on:
  push:
    branches:
      - main
      - "audit/**"
    paths:
      - "scripts/Preparar-L02.ps1"
      - ".github/workflows/validar-l02-windows.yml"
      - "03_GITLAB_PLANTILLA/**"
      - "01_ALUMNOS/L02/**"
      - "01_ALUMNOS/L03/**"
  pull_request:
    paths:
      - "scripts/Preparar-L02.ps1"
      - ".github/workflows/validar-l02-windows.yml"
      - "03_GITLAB_PLANTILLA/**"
      - "01_ALUMNOS/L02/**"
      - "01_ALUMNOS/L03/**"
  workflow_dispatch:
    inputs:
      ensayo_gitlab:
        description: "Validar L02 con el proyecto GitLab privado autorizado"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  laboratorio-l02:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        proyecto:
          - coworking-alm-junior
          - coworking-alm-ensayo
    steps:
      - name: Obtener los materiales de GitHub
        uses: actions/checkout@v4

      - name: Configurar identidad Git de ensayo
        shell: pwsh
        run: |
          git config --global user.name "Alumno CI"
          git config --global user.email "alumno-ci@example.invalid"

      - name: Simular GitLab vacío e importar plantilla por PowerShell
        shell: pwsh
        env:
          PROYECTO: ${{ matrix.proyecto }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "ensayo-l02-$env:PROYECTO"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $remote = Join-Path $root "$env:PROYECTO.git"
          git init --bare --initial-branch=main $remote
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo crear el remoto de prueba.' }

          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/Preparar-L02.ps1'
          & $script -GitLabRepoUrl $remote -CarpetaTrabajo $root -CursoLocal $env:GITHUB_WORKSPACE -Publicar

          $local = Join-Path $root $env:PROYECTO
          foreach ($ruta in @('CLAUDE.md', '.gitignore', '.gitlab', 'alm/maestro.md',
                              'alm/contratos/01-requisitos.md', 'alm/metaprompts/01-requisitos.md',
                              'docs/instrucciones/CASO_NEGOCIO.md', 'app', 'tests')) {
            if (-not (Test-Path -LiteralPath (Join-Path $local $ruta))) {
              throw "No se importó $ruta"
            }
          }
          $archivos = @(git -C $local ls-files)
          if ($archivos -notcontains '.gitignore') { throw 'Falta .gitignore versionado.' }
          if (@($archivos | Where-Object { $_ -like '.gitlab/*' }).Count -lt 1) {
            throw 'Falta .gitlab/ versionado.'
          }
          $main = (git -C $local rev-parse refs/heads/main).Trim()
          $tag = (git -C $local rev-parse refs/tags/base-alm).Trim()
          $manual = (git -C $local rev-parse refs/heads/practica/manual).Trim()
          $remoto = (git -C $local rev-parse refs/remotes/origin/main).Trim()
          if ($main -ne $tag -or $main -ne $manual -or $main -ne $remoto) {
            throw 'main, base-alm, practica/manual u origin/main no apuntan al mismo commit inicial.'
          }
          foreach ($ref in @('refs/heads/main', 'refs/heads/practica/manual', 'refs/tags/base-alm')) {
            git --git-dir=$remote show-ref --verify $ref
            if ($LASTEXITCODE -ne 0) { throw "Falta en el remoto: $ref" }
          }
          $antes = @(git -C $local rev-list --count main)[0].Trim()
          # Ejecutar una segunda vez, sin duplicar commits ni sobrescribir el repositorio.
          & $script -GitLabRepoUrl $remote -CarpetaTrabajo $root -CursoLocal $env:GITHUB_WORKSPACE -Publicar
          $despues = @(git -C $local rev-list --count main)[0].Trim()
          if ($antes -ne $despues -or $despues -ne '1') {
            throw "La repetición añadió commits inesperados: $antes -> $despues."
          }
          if ((git -C $local status --porcelain | Out-String).Trim()) {
            throw 'Quedaron cambios pendientes en el repositorio de ensayo.'
          }
          Write-Host "OK: $env:PROYECTO, importación y repetición, main, tag, rama, push y archivos ocultos."

  l03-prerrequisitos-estaticos:
    runs-on: windows-latest
    steps:
      - name: Obtener materiales
        uses: actions/checkout@v4
      - name: Verificar entradas y secuencia de L03 sin invocar IA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = '03_GITLAB_PLANTILLA'
          foreach ($rel in @(
            'CLAUDE.md', 'alm/maestro.md', 'alm/contratos/01-requisitos.md',
            'alm/metaprompts/01-requisitos.md',
            'docs/instrucciones/CASO_NEGOCIO.md')) {
            if (-not (Test-Path -LiteralPath (Join-Path $p $rel))) {
              throw "L03 requiere un archivo ausente en la plantilla: $rel"
            }
          }
          $practica = Get-Content '01_ALUMNOS/L03/PRACTICA.md' -Raw -Encoding UTF8
          $metaprompt = Get-Content '01_ALUMNOS/L03/METAPROMPT.md' -Raw -Encoding UTF8
          foreach ($clave in @('Gate A', 'Gate B', '01-requisitos.md', 'CASO_NEGOCIO.md', 'practica/manual')) {
            if (-not $practica.Contains($clave)) { throw "Falta referencia L03: $clave" }
          }
          if (-not $metaprompt.Contains('CASO_NEGOCIO.md')) {
            throw 'El metaprompt no exige el caso de negocio versionado.'
          }
          Write-Host 'OK L03: rutas de entrada y secuencia documental verificadas.'
          Write-Host 'No constituye una ejecución de Claude ni acredita issues reales en GitLab.'

  powershell-51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - name: Obtener materiales
        uses: actions/checkout@v4
      - name: Probar script con Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Se esperaba Windows PowerShell 5.1, obtenido $($PSVersionTable.PSVersion)"
          }
          git config --global user.name "Alumno Windows 5.1"
          git config --global user.email "alumno-ps51@example.invalid"
          $raiz = Join-Path $env:RUNNER_TEMP 'ensayo-ps51'
          New-Item -ItemType Directory -Force -Path $raiz | Out-Null
          $remote = Join-Path $raiz 'coworking-alm-ensayo.git'
          git init --bare --initial-branch=main $remote
          if ($LASTEXITCODE -ne 0) { throw 'Error creando remoto simulado.' }
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/Preparar-L02.ps1'
          & $script -GitLabRepoUrl $remote -CarpetaTrabajo $raiz -CursoLocal $env:GITHUB_WORKSPACE -Publicar
          & $script -GitLabRepoUrl $remote -CarpetaTrabajo $raiz -CursoLocal $env:GITHUB_WORKSPACE -Publicar
          $destino = Join-Path $raiz 'coworking-alm-ensayo'
          if (-not (Test-Path (Join-Path $destino 'CLAUDE.md'))) { throw 'Falta CLAUDE.md' }
          if (-not (Test-Path (Join-Path $destino '.gitlab'))) { throw 'Falta .gitlab' }
          $nCommits = (git -C $destino rev-list --count main).Trim()
          if ($nCommits -ne '1') { throw "Se esperaban 1 commit, existen $nCommits" }
          Write-Host 'OK: PowerShell 5.1, clon inicial, commit, main, tag, rama y segunda ejecución.'

  ubuntu-bash-l02:
    name: Importacion Bash (${{ matrix.proyecto }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proyecto: [coworking-alm-junior, coworking-alm-ensayo]
    steps:
      - name: Obtener materiales
        uses: actions/checkout@v4
      - name: Ejecutar clon, copia de archivos ocultos, ramas y tag
        shell: bash
        env:
          PROYECTO: ${{ matrix.proyecto }}
        run: |
          set -euo pipefail
          git config --global user.name "Alumno Bash"
          git config --global user.email "alumno-bash@example.invalid"
          raiz="$(mktemp -d)"
          remote="$raiz/$PROYECTO.git"
          git init --bare --initial-branch=main "$remote"
          export ALM_REMOTE="$remote" ALM_TEST_ROOT="$raiz"
          python3 - <<'PYTHON'
          import os, pathlib, subprocess
          root = pathlib.Path(os.environ["ALM_TEST_ROOT"])
          curso = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          guia = (curso / "01_ALUMNOS/L02/GUIA_GITLAB_PASO_A_PASO.md").read_text()
          bloque = guia.split("~~~bash\n", 1)[1].split("\n~~~", 1)[0]
          bloque = bloque.replace('cd "$HOME"', 'cd "$ALM_TEST_ROOT"')
          bloque = bloque.replace('curso="$PWD/CLAUDE-ALM-GENERATIVO"', 'curso="$GITHUB_WORKSPACE"')
          bloque = bloque.replace('repo="https://gitlab.com/TU_USUARIO/NOMBRE_REAL_DEL_PROYECTO.git"', 'repo="$ALM_REMOTE"')
          # Un clon y un remoto son directorios hermanos.
          subprocess.run(["bash", "-euc", bloque], check=True)
          antes = subprocess.check_output(["git", "ls-remote", "--refs", os.environ["ALM_REMOTE"]])
          assert len(antes.splitlines()) == 3
          assert subprocess.run(["bash", "-euc", bloque]).returncode != 0
          assert antes == subprocess.check_output(["git", "ls-remote", "--refs", os.environ["ALM_REMOTE"]])
          print("OK Bash: bloque publicado, tres referencias y repetición protegida")
          PYTHON

  l03-git-simulado:
    name: L03 - commits y push sobre practica/manual (sin Claude)
    runs-on: windows-latest
    steps:
      - name: Obtener materiales
        uses: actions/checkout@v4
      - name: Validar transicion L02-L03 sin modelo ni GitLab externo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global user.name "Alumno L03"
          git config --global user.email "alumno-l03@example.invalid"
          $root = Join-Path $env:RUNNER_TEMP 'ensayo-l03'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $remote = Join-Path $root 'coworking-alm-junior.git'
          git init --bare --initial-branch=main $remote
          if ($LASTEXITCODE -ne 0) { throw 'Error inicializando remoto simulado.' }
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/Preparar-L02.ps1'
          & $script -GitLabRepoUrl $remote -CarpetaTrabajo $root -CursoLocal $env:GITHUB_WORKSPACE -Publicar
          $dest = Join-Path $root 'coworking-alm-junior'
          $base = (git -C $dest rev-parse base-alm).Trim()
          git -C $dest switch practica/manual
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo activar practica/manual.' }
          $prompt = Join-Path $dest 'alm/prompts-generados/01-requisitos.md'
          $spec = Join-Path $dest 'docs/requisitos/especificacion.md'
          $backlog = Join-Path $dest 'docs/requisitos/backlog.md'
          New-Item -ItemType Directory -Force -Path (Split-Path $prompt) | Out-Null
          New-Item -ItemType Directory -Force -Path (Split-Path $spec) | Out-Null
          'SIMULACION DE GIT, NO GENERACION REAL DE CLAUDE' | Set-Content $prompt
          'SIMULACION DE GIT, NO REQUISITOS APROBADOS' | Set-Content $spec
          'SIMULACION DE GIT, NO ISSUES REALES' | Set-Content $backlog
          Add-Content (Join-Path $dest 'alm/evidencias/registro.md') 'ENSAYO AUTOMATICO, NO ES GATE HUMANO'
          git -C $dest add alm/prompts-generados/01-requisitos.md docs/requisitos alm/evidencias/registro.md
          if ($LASTEXITCODE -ne 0) { throw 'git add de L03 ha fallado.' }
          git -C $dest commit -m 'test: simular publicacion de requisitos'
          if ($LASTEXITCODE -ne 0) { throw 'git commit de L03 ha fallado.' }
          git -C $dest push -u origin practica/manual
          if ($LASTEXITCODE -ne 0) { throw 'git push de L03 ha fallado.' }
          $manual = (git -C $dest rev-parse refs/remotes/origin/practica/manual).Trim()
          $main = (git -C $dest rev-parse refs/remotes/origin/main).Trim()
          $tag = (git -C $dest rev-parse base-alm).Trim()
          if ($manual -eq $main -or $tag -ne $base -or $main -ne $base) {
            throw 'La generacion L03 simulada cambio main/base-alm o no avanzo practica/manual.'
          }
          $nuevo = Join-Path $root 'segundo-clon'
          & $script -GitLabRepoUrl $remote -CarpetaTrabajo $nuevo -CursoLocal $env:GITHUB_WORKSPACE -Publicar
          $destNuevo = Join-Path $nuevo 'coworking-alm-junior'
          $recuperada = (git -C $destNuevo rev-parse refs/heads/practica/manual).Trim()
          if ($recuperada -ne $manual) { throw 'El nuevo clon no conservó el avance de practica/manual.' }
          Write-Host 'OK L03 Git: archivos, commit, push en practica/manual; main y base-alm intactos.'
          Write-Host 'La prueba NO ejecuta Claude ni crea issues GitLab.'

  gitlab-real:
    name: L02 HTTPS contra GitLab (solicitud expresa)
    if: github.event_name == 'workflow_dispatch' && inputs.ensayo_gitlab
    runs-on: windows-latest
    timeout-minutes: 10
    concurrency: ensayo-gitlab-l02
    environment: ensayo-gitlab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspeccionar, preparar y comprobar dos veces
        shell: pwsh
        env:
          ENSAYO_URL: ${{ vars.GITLAB_ENSAYO_URL }}
          ENSAYO_TOKEN: ${{ secrets.GITLAB_ENSAYO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "Never"
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:ENSAYO_URL
          if ($repo -cnotmatch '^https://gitlab[.]com/jaimedeeplearning/coworking-alm-ensayo[.]git$') {
              throw 'Configura la URL HTTPS exacta del ensayo autorizado.'
          }
          if (-not $env:ENSAYO_TOKEN) { throw 'Falta el secreto de proyecto GITLAB_ENSAYO_TOKEN.' }
          $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("oauth2:$env:ENSAYO_TOKEN"))
          Write-Output "::add-mask::$basic"
          $env:GIT_CONFIG_COUNT = '2'
          $env:GIT_CONFIG_KEY_0 = "http.$repo.extraHeader"
          $env:GIT_CONFIG_VALUE_0 = "Authorization: Basic $basic"
          $env:GIT_CONFIG_KEY_1 = "http.followRedirects"
          $env:GIT_CONFIG_VALUE_1 = "false"
          Remove-Item Env:ENSAYO_TOKEN
          $antes = @(git ls-remote --refs $repo)
          if ($LASTEXITCODE -ne 0) { throw 'Fallo de lectura HTTPS del proyecto privado.' }
          Write-Host "Referencias observadas antes de escribir: $($antes.Count)"
          git config --global user.name "Ensayo ALM"
          git config --global user.email "ensayo-alm@example.invalid"
          $params = @{ GitLabRepoUrl=$repo; CursoLocal=$env:GITHUB_WORKSPACE; CarpetaTrabajo=$env:RUNNER_TEMP }
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/Preparar-L02.ps1'
          & $script @params
          $local = Join-Path $env:RUNNER_TEMP 'coworking-alm-ensayo'
          $baseTree = git -C $local rev-parse 'main^{tree}'
          $plantilla = git rev-parse HEAD:03_GITLAB_PLANTILLA
          if (-not $baseTree -or $baseTree -ne $plantilla) { throw 'La base contiene otro material. Revisar.' }
          & $script @params -Publicar
          $primera = @(git ls-remote --refs $repo)
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron leer las referencias tras publicar.' }
          $params.CarpetaTrabajo = Join-Path $env:RUNNER_TEMP 'repeticion'
          & powershell.exe -NoProfile -NonInteractive -File $script -GitLabRepoUrl $repo -CursoLocal $env:GITHUB_WORKSPACE -CarpetaTrabajo $params.CarpetaTrabajo -Publicar
          if ($LASTEXITCODE -ne 0) { throw 'Falló la repetición en Windows PowerShell 5.1.' }
          $segunda = @(git ls-remote --refs $repo)
          if ($LASTEXITCODE -ne 0 -or (Compare-Object $primera $segunda)) { throw 'Las referencias cambiaron en la repetición.' }
          Write-Host 'OK GitLab.com HTTPS: PowerShell 7 y 5.1, dos clones y referencias estables.'

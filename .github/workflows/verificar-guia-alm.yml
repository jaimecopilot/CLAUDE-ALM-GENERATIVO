name: Verificar guía PDF de alumnado

on:
  push:
    branches: [main]
    paths:
      - "01_ALUMNOS/GUIA_ALUMNADO_CLAUDE_GITLAB_VSCODE_ALM_2026.pdf"
      - "01_ALUMNOS/Manual_Alumno_ALM_Generativo_16h_2026.pdf"
      - "README.md"
      - "01_ALUMNOS/README.md"
      - "01_ALUMNOS/L02/PRACTICA.md"
      - ".github/workflows/verificar-guia-alm.yml"
  pull_request:
    paths:
      - "01_ALUMNOS/*.pdf"
      - "01_ALUMNOS/README.md"
      - ".github/workflows/verificar-guia-alm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar-guia:
    name: PDF, portada y enlaces
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Instalar lector PDF estructural
        run: python3 -m pip install --disable-pip-version-check 'pypdf>=5,<7'
      - name: Verificar PDF y referencias de los manuales
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          pdf_path = Path("01_ALUMNOS/GUIA_ALUMNADO_CLAUDE_GITLAB_VSCODE_ALM_2026.pdf")
          content = pdf_path.read_bytes()
          assert content.startswith(b"%PDF-"), "El archivo no tiene cabecera PDF"
          assert len(content) > 50_000, "El PDF parece incompleto"
          reader = PdfReader(str(pdf_path))
          page_count = len(reader.pages)
          assert page_count == 23, f"Se esperaban 23 páginas, encontradas {page_count}"
          operative = (reader.pages[5].extract_text() or "") + (reader.pages[6].extract_text() or "")
          for marker in ("Preparar-L02.ps1", "practica/manual", "git ls-remote", "-Publicar"):
              assert marker in operative, f"El procedimiento L02 del PDF no contiene: {marker}"
          manual = PdfReader("01_ALUMNOS/Manual_Alumno_ALM_Generativo_16h_2026.pdf", strict=True)
          texto = "\n".join(page.extract_text() or "" for page in manual.pages)
          for marker in [*(f"L{i:02}" for i in range(1, 12)), "Preparar-L02.ps1",
                         "Gate A", "Gate B", "referencia/alm-automatico"]:
              assert marker in texto, f"Manual extenso sin {marker}"
          assert "GUION RESERVADO DEL FORMADOR" not in texto
          print(f"Manual del alumno: {len(manual.pages)} páginas y once laboratorios.")
          expected = {
              "README.md": "./01_ALUMNOS/GUIA_ALUMNADO_CLAUDE_GITLAB_VSCODE_ALM_2026.pdf",
              "01_ALUMNOS/README.md": "./GUIA_ALUMNADO_CLAUDE_GITLAB_VSCODE_ALM_2026.pdf",
              "01_ALUMNOS/L02/PRACTICA.md": "../GUIA_ALUMNADO_CLAUDE_GITLAB_VSCODE_ALM_2026.pdf",
          }
          for file, link in expected.items():
              assert link in Path(file).read_text(encoding="utf-8"), f"Falta enlace en {file}"
          print(f"OK: PDF válido ({len(content)} bytes), {page_count} páginas y 3 enlaces.")
          PY
